apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

react {
  autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def vcode = (int)(((new Date().getTime()/1000) - 1451606400) / 10)
def hermesEnabledProp = project.hasProperty('hermesEnabled') ? project.property('hermesEnabled') : 'true'

android {
  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdk 36

  namespace "com.liganacionalgt"

  defaultConfig {
    applicationId "com.liganacionalgt"
    minSdk 24
    targetSdk 35
    versionCode vcode
    versionName "5.4.0"
    ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86_64" }
  }

  packaging {
    jniLibs { useLegacyPackaging = false }
    resources {
      excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
    }
  }

  bundle {
    language.enableSplit = false
    density.enableSplit = true
    abi.enableSplit = false
  }

  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    release {
      if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
        storeFile file(MYAPP_UPLOAD_STORE_FILE)
        storePassword MYAPP_UPLOAD_STORE_PASSWORD
        keyAlias MYAPP_UPLOAD_KEY_ALIAS
        keyPassword MYAPP_UPLOAD_KEY_PASSWORD
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  buildTypes {
    debug { signingConfig signingConfigs.debug }
    release {
      minifyEnabled enableProguardInReleaseBuilds
      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
      signingConfig signingConfigs.release
    }
  }
}

configurations {
  reactAarExtractor {
    canBeConsumed = false
    canBeResolved = true
  }
}

dependencies {
  implementation "com.facebook.react:react-android:0.79.2"

  if (Boolean.parseBoolean(hermesEnabledProp.toString())) {
    implementation "com.facebook.react:hermes-android:0.79.2"
  }

  implementation platform('com.google.firebase:firebase-bom:33.5.1')
  implementation 'com.google.android.play:integrity:1.3.0'
}

apply plugin: "com.google.gms.google-services"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"