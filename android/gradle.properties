# --- Keystore Liga Nacional GT ---
MYAPP_UPLOAD_STORE_FILE=liga-nacional-gt.keystore
MYAPP_UPLOAD_KEY_ALIAS=liga-nacional-gt
MYAPP_UPLOAD_STORE_PASSWORD=Tashaymax_1998
MYAPP_UPLOAD_KEY_PASSWORD=Tashaymax_1998

# --- Android ---
android.useAndroidX=true
android.enableJetifier=true
android.ndkVersion=28.0.12433566

# --- React Native ---
hermesEnabled=true
newArchEnabled=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
REANIMATED_CPP_STD=17

# --- Gradle runtime ---
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
