pluginManagement {
  repositories {
    gradlePluginPortal()
    mavenCentral()
    google()
  }
  includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
  id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand()
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

  repositories {
    mavenCentral()
    google()

    // ✅ Notifee trae su librería nativa (app.notifee:core) DENTRO del paquete npm.
    //    Con PREFER_SETTINGS el repositorio que declara el módulo se ignora,
    //    así que hay que apuntarlo aquí (no existe un maven público de Notifee).
    maven { url = uri(file("../node_modules/@notifee/react-native/android/libs")) }

    exclusiveContent {
      forRepository {
        maven {
          name = "ReactMavenCentral"
          url = uri("https://repo.maven.apache.org/maven2/")
        }
      }
      filter {
        includeModule("com.facebook.react", "react-android")
        includeModule("com.facebook.react", "hermes-android")
      }
    }
  }
}

rootProject.name = "chapin"
include(":app")